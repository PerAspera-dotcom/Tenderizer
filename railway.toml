# Railway config-as-code for the backend service (repo root = service root).
# TO BE DELETED (CR-019) once .railway/railway.ts has been applied: Railway
# stops reading this file on 2026-12-01.

[build]
# These two lines are the ONLY thing holding builds on the Dockerfile. The
# service's own stored builder is RAILPACK (Python 3.13, no requirements.lock,
# no pg_dump). Railway applies them per deploy, from this file.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# NOT IN EFFECT. Railway reads these two keys but has never applied them:
# the service shows healthcheckPath null, and no deploy has waited on a
# healthcheck (docs/INCIDENT_2026-11-23_BACKEND_DEPLOY.md). The gate arrives
# with `railway config apply` of .railway/railway.ts.
healthcheckPath = "/api/health-check"
healthcheckTimeout = 300
