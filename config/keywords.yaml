# Keyword safeguard layer (OR'd with CPV in the query). Broad, derived from the official
# CPV EN/FR/NL/DE labels. Whole-word, accent-insensitive matching, so plurals/accents are
# listed explicitly. All four languages sourced from the official CPV 2008 vocabulary.
# German: umlaut forms also cover the naive-stripped spelling (ü->u) via unidecode folding;
# the ue/ae/oe/ss transliterations are added separately for systems that don't support
# umlauts/eszett.
terms:
  # cabin/cabins/cubicle/cubicles/portable (+ FR/NL/DE forms) removed CR-001 F8: orphaned
  # by F3 — their only source CPV codes (44211110, 44211200, 44211100) are now exclusion-
  # only, not active, so these terms no longer trace to any active code.
  en: [tent, tents, marquee, shelter, shelters, awning, awnings, tarpaulin, tarpaulins,
       sunblind, sunblinds, camouflage, canopy, gazebo, bivouac,
       # CR-001 F7 sync — 35800000, 39511100, 39522520, 39522540:
       blanket, blankets, camp bed, camp beds, sleeping bag, sleeping bags,
       individual equipment, support equipment]
  fr: [tente, tentes, chapiteau, chapiteaux, abri, abris, campement, bache, baches,
       auvent, auvents, marquise, marquises, velum, camouflage,
       couverture, couvertures, lit de camp, lits de camp, sac de couchage,
       sacs de couchage, equipement individuel, equipement de soutien]
  nl: [tent, tenten, zeil, zeilen, dekzeil, dekzeilen, zonwering, zonweringen,
       camouflage, camouflagehoes, schuilhok, schuilhokje, schuiltent, onderkomen,
       deken, dekens, veldbed, veldbedden, slaapzak, slaapzakken,
       persoonlijke uitrusting, ondersteunende uitrusting]
  de: [Zelt, Zelte, Zelten, Zeltreparatur, Zeltreparatursets, Plane, Planen, Sonnensegel,
       Markise, Markisen, Tarnung, Tarnüberzug, Tarnüberzüge, Tarnnetz, Campingausrüstung,
       Campingausrüstungen, Schutzunterkunft, Schutzunterkünfte, Schutzunterkünften,
       Unterstand, Unterstände, Unterkunft, Militärschutzraum, Militärschutzräume,
       Militärschutzräumen, Schutzraum,
       Decke, Decken, Feldbett, Feldbetten, Schlafsack, Schlafsäcke,
       persönliche Ausrüstung, Hilfsausrüstung,
       # ue/ae/oe/ss transliterations for systems without umlaut/eszett support:
       Tarnueberzug, Tarnueberzuege, Campingausruestung, Campingausruestungen,
       Schutzunterkuenfte, Schutzunterkuenften, Unterstaende, Militaerschutzraum,
       Militaerschutzraeume, Militaerschutzraeumen, Schlafsaecke,
       persoenliche Ausruestung, Hilfsausruestung]

# Distinctive subset fed into the LIVE TED query as a title match (notice-title = exact).
# High-signal, unambiguous tent/cover words only — keeps the live pull tight (~25 title
# matches; CPV OR title=distinctive ≈ 384 total). The full 'terms' library above is NOT
# used in the TED query (full-text + stemming floods to ~75k); it is used client-side to
# tag which terms matched each returned result. Broad words (shelter, modular, Unterkunft,
# abri, cabine, container) are deliberately excluded here because they flood titles too.
distinctive: [tent, tents, tente, tentes, chapiteau, chapiteaux, marquee, Zelt, Zelte,
              Zelten, tarpaulin, tarpaulins, bache, baches, dekzeil, dekzeilen, camouflage,
              Tarnung, Tarnnetz, Sonnensegel, Markise, Markisen, campement, schuiltent,
              gazebo]

# Compound matching (2026-10-17). German and Dutch write compounds as one word, so the
# whole-word matcher missed "Festzelt", "Sanitätszelte", "Partyzelten", "afdekzeil",
# "legertent". A tenant keyword whose folded form is listed here also matches inside a
# longer word. Global, not tenant-scoped: it only widens keywords a tenant already has.
# Used for relevance matching only (tagging + connector keyword reinforcement), never
# for the exclusion/classification term lists, which stay whole-word.
compounds:
  # stem at the END of a word (the compound's head noun), plus an optional inflection
  # (-e/-en/-er/-es/-n/-s): Festzelt, Sanitätszelte, Fahrzeugtarnung, afdekzeil.
  head: [zelt, zelte, zelten, tarnnetz, tarnung, sonnensegel, markise, markisen,
         dekzeil, dekzeilen, tent, tenten]
  # stem at the START of a word: Zeltplane, Zeltheizung, Zeltboden.
  modifier: [zelt]
  # whole words never treated as compounds — "tent" ends a lot of English and Dutch
  # words that have nothing to do with tents.
  not: [content, contents, discontent, malcontent, extent, extents, intent, intents,
        latent, patent, patents, patenten, potent, impotent, omnipotent, portent,
        competent, incompetent, consistent, inconsistent, persistent, insistent,
        existent, nonexistent, subsistent, resistent, assistent, assistenten, attent,
        penitent]
