[project]
name = "the_scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "openpyxl",
    "python-dotenv",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "psycopg[binary]",
    "pyjwt[crypto]",
    "unidecode",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "apscheduler",
    # Pinned 2026-11-23: an unpinned rebuild pulled a sentry-sdk that rejects
    # src/api.py's sentry_sdk.init(send_default_pii=False) with
    # "TypeError: Unknown option", crashing the app at startup (deployment
    # f505b181, rolled back). 2.64.0 is the version verified locally.
    "sentry-sdk[fastapi]==2.64.0",
    # Vault (document ingest/embed/metadata-extraction) — see src/vault.py.
    "chromadb",
    "sentence-transformers",
    "pdfplumber",
    "python-docx",
    "pymupdf",
    "anthropic",
    # Composer (src/composer.py) — compliance_matrix.xlsx read/write, ported
    # from proposal_tool/generate.py's pandas-based column parsing.
    "pandas",
    # CR-004 F4 — backup upload/download to S3-compatible object storage
    # (AWS S3 / Backblaze B2 / GCS all speak this API). Inert if
    # BACKUP_S3_BUCKET is unset — see src/backup.py.
    "boto3",
]

[project.optional-dependencies]
# Local development only (`pip install -e .[dev]`); the Docker image installs
# the base set via `pip install .` and never pulls these.
dev = [
    "pytest>=9.1",
    "pyflakes>=4.1",
]

[project.scripts]
tenderizer = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]
